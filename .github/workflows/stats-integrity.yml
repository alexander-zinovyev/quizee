name: Statistics integrity

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  verify:
    # Opt in only after configuring a read-capable service account and reviewing full-scan costs.
    if: vars.STATS_INTEGRITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.STATS_FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.STATS_FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.STATS_FIREBASE_PRIVATE_KEY }}
      STATS_ACTOR_UID: ${{ vars.STATS_ADMIN_UID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stats:ops -- integrity --actor "$STATS_ACTOR_UID" --project "$FIREBASE_PROJECT_ID" --all
